name: PHP

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install php code sniffer
        run: composer require "squizlabs/php_codesniffer=*"
      - name: Run linting
        run: composer lint

  unit_tests:
    name: Unit Tests ${{ matrix.php-versions }}
    needs: [ linting ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.1', '8.2' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up PHP v${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Install dependencies
        run: composer install
      - name: Run tests
        run: |
          mkdir -p ./build/logs
          ./vendor/bin/phpunit --coverage-clover ./build/logs/clover.xml
      - name: Verify clover.xml created
        run: |
          if [ ! -f ./build/logs/clover.xml ]; then
            echo "clover.xml was not created"
            exit 1
          fi
      - name: Upload coverage results to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer global require php-coveralls/php-coveralls
          php-coveralls --coverage_clover=./build/logs/clover.xml -v

  latest_dependency_tests:
    name: Latest Deps (PHP ${{ matrix.php-versions }})
    needs: [ linting ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.1', '8.2' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up PHP v${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Install dependencies
        run: composer install
      - name: Install latest supported dependencies
        run: composer update justinrainbow/json-schema lastguest/murmurhash --with-dependencies
      - name: Verify latest majors resolved
        run: |
          composer show justinrainbow/json-schema lastguest/murmurhash
          php -r '
            require "vendor/autoload.php";
            $jsonSchema = Composer\InstalledVersions::getVersion("justinrainbow/json-schema");
            $murmur = Composer\InstalledVersions::getVersion("lastguest/murmurhash");
            echo "json-schema: $jsonSchema\nmurmurhash: $murmur\n";
            exit((version_compare($jsonSchema, "6.0.0", ">=") && version_compare($murmur, "2.0.0", ">=")) ? 0 : 1);
          '
      - name: Run tests
        run: |
          mkdir -p ./build/logs
          ./vendor/bin/phpunit

  integration_tests:
    name: Integration Tests
    needs: [ unit_tests ]
    uses: optimizely/php-sdk/.github/workflows/integration_test.yml@master
    secrets:
      CI_USER_TOKEN: ${{ secrets.CI_USER_TOKEN }}
      TRAVIS_COM_TOKEN: ${{ secrets.TRAVIS_COM_TOKEN }}
